name: Capture ChromaLab README screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-readme.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/chromalab-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chromalab-preview.log
          exit 1
      - name: Capture
        run: |
          mkdir -p docs/assets
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } })
          await page.emulateMedia({ reducedMotion: 'reduce', colorScheme: 'dark' })
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          await page.screenshot({
            path: 'docs/assets/chromalab-studio.png',
            fullPage: true,
          })
          await browser.close()
          NODE
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/chromalab-studio.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add ChromaLab studio screenshot"
          git push
